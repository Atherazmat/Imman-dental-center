<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Imaan Dental Centre — Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --g-0:#0c0c0c;
    --g-1:#1c1c1c;
    --g-2:#2c2c2c;
    --g-3:#3f3f3f;
    --g-4:#585858;
    --g-5:#767676;
    --g-6:#979797;
    --g-7:#b8b8b8;
    --g-8:#d6d6d4;
    --g-9:#e7e6e3;
    --g-10:#f1f0ed;
    --g-11:#f8f7f5;
    --paper:#faf9f7;
    --line:#dcdad5;
    --line-soft:#e9e7e2;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.18);
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--g-1);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--g-2); color:var(--paper);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--g-8); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:inherit;}

  /* ---------- Gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(180deg, var(--g-0), var(--g-1) 60%, var(--g-0));
    padding:24px;
  }
  .gate-card{
    width:100%; max-width:380px;
    background:var(--paper);
    border-radius:20px;
    padding:40px 34px 34px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.55);
    position:relative;
    overflow:hidden;
  }
  .gate-card::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px; height:140px; border-radius:50%;
    border:1px dashed var(--line);
  }
  .gate-mark{
    width:46px; height:46px; border-radius:50%;
    background:var(--g-1);
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); font-family:var(--serif); font-weight:600; font-size:18px;
    margin-bottom:20px;
  }
  .gate-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--g-5); margin:0 0 6px;
  }
  .gate-title{
    font-family:var(--serif); font-weight:600; font-size:26px; margin:0 0 26px; color:var(--g-0);
    line-height:1.15;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--g-5); margin-bottom:7px; font-weight:600;
  }
  .field input{
    width:100%; padding:13px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:#fff; color:var(--g-0);
    font-size:15px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{border-color:var(--g-2); box-shadow:0 0 0 3px rgba(0,0,0,.06);}
  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:10px; padding:13px 18px;
    font-weight:600; font-size:14.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, background .15s, opacity .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--g-1); color:var(--paper); width:100%;}
  .btn-primary:hover{background:var(--g-0);}
  .btn-ghost{background:transparent; color:var(--g-4); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--g-5); color:var(--g-1);}
  .btn-danger{background:transparent; color:#7a3b3b;}
  .btn-sm{padding:8px 13px; font-size:13px; border-radius:8px;}
  .gate-error{
    font-size:13px; color:#8a3a3a; background:#f6e9e9; border:1px solid #e3c9c9;
    padding:9px 12px; border-radius:8px; margin-bottom:14px; display:none;
  }
  .gate-foot{margin-top:18px; font-size:12.5px; color:var(--g-6); line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh;}
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex:none; background:var(--g-0); color:var(--g-8);
    display:flex; flex-direction:column; padding:22px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:11px; padding:6px 8px 22px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:16px;}
  .brand-mark{width:34px; height:34px; border-radius:50%; background:var(--paper); color:var(--g-0); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:15px; flex:none;}
  .brand-name{font-family:var(--serif); font-size:15.5px; line-height:1.2; color:var(--paper); font-weight:600;}
  .brand-sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--g-6); text-transform:uppercase; margin-top:2px;}
  nav{display:flex; flex-direction:column; gap:3px;}
  .nav-btn{
    display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:9px;
    background:transparent; border:none; color:var(--g-6); cursor:pointer; text-align:left;
    font-size:14px; font-weight:500; transition:background .15s, color .15s;
  }
  .nav-btn svg{width:17px; height:17px; flex:none; opacity:.85;}
  .nav-btn:hover{background:rgba(255,255,255,.06); color:var(--g-9);}
  .nav-btn.active{background:var(--paper); color:var(--g-0); font-weight:600;}
  .nav-btn.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.08);}
  .conn-pill{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--g-6);
    padding:9px 10px; border-radius:8px; background:rgba(255,255,255,.04); margin-bottom:8px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--g-5); flex:none;}
  .dot.on{background:#c8c8c8; box-shadow:0 0 0 3px rgba(255,255,255,.08);}
  .lock-btn{width:100%; justify-content:flex-start; color:var(--g-6);}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 34px; border-bottom:1px solid var(--line-soft);
    background:var(--g-11);
    position:sticky; top:0; z-index:10;
  }
  .topbar h1{font-family:var(--serif); font-size:22px; margin:0; font-weight:600; color:var(--g-0);}
  .topbar .sub{font-size:12.5px; color:var(--g-5); margin-top:3px;}
  .topbar-actions{display:flex; gap:10px; align-items:center;}
  .menu-toggle{display:none;}

  .content{padding:28px 34px 60px; flex:1;}
  .grid{display:grid; gap:18px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  @media(max-width:640px){.grid-4{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr;}}

  .card{
    background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow);
  }
  .stat-card{padding:20px 22px;}
  .stat-label{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--g-5); margin-bottom:10px;}
  .stat-value{font-family:var(--serif); font-size:32px; font-weight:600; color:var(--g-0); line-height:1;}
  .stat-foot{font-size:12px; color:var(--g-5); margin-top:8px;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .section-head h2{font-family:var(--serif); font-size:19px; margin:0; font-weight:600;}
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
    border-radius:9px; padding:9px 12px; min-width:220px;
  }
  .search-box svg{width:15px; height:15px; color:var(--g-5); flex:none;}
  .search-box input{border:none; outline:none; background:transparent; font-size:13.5px; width:100%; color:var(--g-1);}
  select.select{
    padding:9px 12px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; color:var(--g-1); outline:none;
  }

  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--g-5);
    font-weight:600; padding:0 14px 10px; border-bottom:1.5px solid var(--line);
  }
  tbody td{padding:14px; border-bottom:1px solid var(--line-soft); font-size:14px; color:var(--g-1); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--g-11);}
  .name-cell{font-weight:600; color:var(--g-0);}
  .muted{color:var(--g-5);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--g-4);
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--g-1); color:#fff; border-color:var(--g-1);}
  .icon-btn svg{width:14px; height:14px;}

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    font-size:11.5px; font-weight:600; letter-spacing:.02em;
  }
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge-waiting{background:var(--g-9); color:var(--g-3);}
  .badge-progress{background:var(--g-2); color:var(--g-11);}
  .badge-done{background:#eceae4; color:var(--g-5);}
  .badge-cancelled{background:transparent; color:var(--g-6); border:1px solid var(--line);}
  .badge-scheduled{background:var(--g-9); color:var(--g-3);}
  .badge-completed{background:var(--g-2); color:var(--g-11);}

  .empty{
    text-align:center; padding:56px 20px; color:var(--g-5);
  }
  .empty svg{width:38px; height:38px; margin-bottom:14px; opacity:.5;}
  .empty p{margin:4px 0 0; font-size:13.5px;}
  .empty .empty-title{font-family:var(--serif); font-size:17px; color:var(--g-2); font-weight:600;}

  /* Ticket / token signature element */
  .ticket-row{display:flex; gap:22px; align-items:stretch; flex-wrap:wrap;}
  .ticket{
    position:relative; width:220px; flex:none;
    background:var(--g-0); color:var(--paper); border-radius:16px;
    padding:22px 20px 20px; overflow:hidden;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:22px; height:22px; background:var(--paper); border-radius:50%;
    top:50%; transform:translateY(-50%);
  }
  .ticket::before{left:-11px;}
  .ticket::after{right:-11px;}
  .ticket .perf{
    position:absolute; left:16px; right:16px; top:calc(50% - 1px); border-top:2px dashed rgba(255,255,255,.25);
  }
  .ticket-top{padding-bottom:20px;}
  .ticket-eyebrow{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--g-6); margin-bottom:8px;}
  .ticket-num{font-family:var(--serif); font-size:48px; font-weight:700; line-height:1;}
  .ticket-bottom{padding-top:20px;}
  .ticket-name{font-size:13.5px; font-weight:600; margin-bottom:3px;}
  .ticket-status{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--g-6);}

  .queue-list{flex:1; min-width:260px; display:flex; flex-direction:column; gap:8px;}
  .queue-item{
    display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--line-soft);
    border-radius:11px; background:#fff;
  }
  .queue-token{
    font-family:var(--serif); font-weight:700; font-size:18px; width:34px; text-align:center; color:var(--g-1);
  }
  .queue-info{flex:1; min-width:0;}
  .queue-info .name{font-weight:600; font-size:13.5px; color:var(--g-0);}
  .queue-info .meta{font-size:11.5px; color:var(--g-5);}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,10,10,.5); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:18px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    padding:28px; box-shadow:0 40px 90px -20px rgba(0,0,0,.4);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .modal-head h3{font-family:var(--serif); font-size:20px; margin:0; font-weight:600;}
  .close-x{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--g-4);}
  .close-x:hover{background:var(--g-1); color:#fff; border-color:var(--g-1);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal textarea{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; outline:none; resize:vertical; min-height:70px; color:var(--g-0);
  }
  .modal select{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; outline:none; background:#fff; color:var(--g-0);
  }
  .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .modal-actions .btn{flex:1;}

  /* Settings */
  .settings-block{margin-bottom:26px;}
  .settings-block h3{font-family:var(--serif); font-size:16.5px; margin:0 0 4px; font-weight:600;}
  .settings-block .desc{font-size:12.5px; color:var(--g-5); margin:0 0 14px; line-height:1.5;}
  .code-block{
    background:var(--g-0); color:var(--g-8); font-family:var(--mono); font-size:11.5px; line-height:1.7;
    padding:16px; border-radius:11px; white-space:pre; overflow-x:auto; max-height:260px; overflow-y:auto;
  }
  .toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  .toast{
    background:var(--g-0); color:var(--paper); padding:12px 16px; border-radius:10px; font-size:13.5px;
    box-shadow:0 12px 30px -8px rgba(0,0,0,.4); display:flex; align-items:center; gap:9px;
    animation:in .18s ease;
  }
  .toast.err{background:#3a2323;}
  @keyframes in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .hidden{display:none !important;}

  /* Mobile */
  @media(max-width:880px){
    .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:60; transform:translateX(-100%); transition:transform .2s ease; box-shadow:20px 0 50px rgba(0,0,0,.3);}
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--g-2);}
    .topbar{padding:16px 18px;}
    .content{padding:18px 16px 50px;}
    .field-row{grid-template-columns:1fr;}
    .backdrop-mobile{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55; display:none;}
    .backdrop-mobile.show{display:block;}
  }
</style>
</head>
<body>

<!-- ================= PASSWORD GATE ================= -->
<div id="gate">
  <div class="gate-card" id="gateCard"></div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="backdrop-mobile" id="backdrop"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">I</div>
        <div>
          <div class="brand-name">Imaan Dental<br>Centre</div>
          <div class="brand-sub">Front Desk</div>
        </div>
      </div>
      <nav id="navList"></nav>
      <div class="sidebar-foot">
        <div class="conn-pill"><span class="dot" id="connDot"></span><span id="connLabel">Checking connection…</span></div>
        <button class="nav-btn lock-btn" id="lockBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3"/></svg>
          Lock site
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-toggle" id="menuToggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="sub" id="pageSub">Today's overview</div>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

/* ============================================================
   ICONS
============================================================ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>',
  tokens:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9a2 2 0 012-2h14a2 2 0 012 2v1.5a1.5 1.5 0 000 3V15a2 2 0 01-2 2H5a2 2 0 01-2-2v-1.5a1.5 1.5 0 000-3V9z"/><path d="M10 7v10" stroke-dasharray="2 2"/></svg>',
  patients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.5 14.2c2.9.4 5 2.5 5 5.8"/></svg>',
  appointments:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  payments:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10.5h19"/><path d="M6 15h4"/></svg>',

/* ============================================================
   STATE + STORAGE ABSTRACTION
============================================================ */
const LS_KEYS = {
  pw:'imaan_pw', sbUrl:'imaan_sb_url', sbKey:'imaan_sb_key',
  patients:'imaan_patients', tokens:'imaan_tokens', appts:'imaan_appts', payments:'imaan_payments'
};

let sbClient = null;
let dbMode = 'local'; // 'supabase' | 'local'
let activeTab = 'dashboard';
let editing = { type:null, id:null };

function uid(){ return crypto.randomUUID(); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtMoney(n){ return 'Rs ' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function lsGet(key){ try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; } }
function lsSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

/* ---- Generic table operations that transparently use Supabase or localStorage ---- */
const Table = (name, lsKey) => ({
  async list(orderCol='created_at', asc=false){
    if(dbMode==='supabase'){
      const { data, error } = await sbClient.from(name).select('*').order(orderCol, { ascending: asc });
      if(error){ toast('Could not reach Supabase — switched to local storage.', true); await fallbackToLocal(); return lsGet(lsKey); }
      return data;
    }
    const rows = lsGet(lsKey);
    rows.sort((a,b)=> asc ? (a[orderCol]>b[orderCol]?1:-1) : (a[orderCol]<b[orderCol]?1:-1));
    return rows;
  },
  async add(obj){
    const row = { id: uid(), created_at: new Date().toISOString(), ...obj };
    if(dbMode==='supabase'){
      const { data, error } = await sbClient.from(name).insert(row).select().single();
      if(error){ toast('Save failed on Supabase — saved locally instead.', true); await fallbackToLocal(); }
      else return data;
    }
    const rows = lsGet(lsKey); rows.push(row); lsSet(lsKey, rows);
    return row;
  },
  async update(id, patch){
    if(dbMode==='supabase'){
      const { data, error } = await sbClient.from(name).update(patch).eq('id', id).select().single();
      if(error){ toast('Update failed on Supabase — updated locally instead.', true); await fallbackToLocal(); }
      else return data;
    }
    const rows = lsGet(lsKey);
    const idx = rows.findIndex(r=>r.id===id);
    if(idx>-1){ rows[idx] = { ...rows[idx], ...patch }; lsSet(lsKey, rows); return rows[idx]; }
  },
  async remove(id){
    if(dbMode==='supabase'){
      const { error } = await sbClient.from(name).delete().eq('id', id);
      if(error){ toast('Delete failed on Supabase — removed locally instead.', true); await fallbackToLocal(); }
      else return true;
    }
    lsSet(lsKey, lsGet(lsKey).filter(r=>r.id!==id));
    return true;
  }
});

const DB = {
  patients: Table('patients', LS_KEYS.patients),
  tokens: Table('tokens', LS_KEYS.tokens),
  appts: Table('appointments', LS_KEYS.appts),
  payments: Table('payments', LS_KEYS.payments),
};

async function fallbackToLocal(){
  dbMode = 'local';
  updateConnPill();
}

/* ============================================================
   SUPABASE CONNECTION
============================================================ */
async function tryConnect(){
  const url = localStorage.getItem(LS_KEYS.sbUrl);
  const key = localStorage.getItem(LS_KEYS.sbKey);
  if(!url || !key){ dbMode='local'; updateConnPill(); return; }
  try{
    const client = window.supabase.createClient(url, key);
    const { error } = await client.from('patients').select('id', { count:'exact', head:true });
    if(error) throw error;
    sbClient = client;
    dbMode = 'supabase';
  }catch(e){
    dbMode = 'local';
  }
  updateConnPill();
}

function updateConnPill(){
  const dot = document.getElementById('connDot');
  const label = document.getElementById('connLabel');
  if(dbMode==='supabase'){ dot.classList.add('on'); label.textContent = 'Connected to Supabase'; }
  else{ dot.classList.remove('on'); label.textContent = 'Working from local storage'; }
}

function renderGate(){
  const hasPw = !!localStorage.getItem(LS_KEYS.pw);
  const card = document.getElementById('gateCard');
  if(!hasPw){
    card.innerHTML = `
      <div class="gate-mark">I</div>
      <p class="gate-eyebrow">First-time setup</p>
      <h2 class="gate-title">Create a password<br>for this site</h2>
      <div class="gate-error" id="gateErr"></div>
      <div class="field"><label>New password</label><input type="password" id="pw1" placeholder="Choose a password"></div>
      <div class="field"><label>Confirm password</label><input type="password" id="pw2" placeholder="Type it again"></div>
      <button class="btn btn-primary" id="setPwBtn">Save &amp; enter</button>
      <p class="gate-foot">This only guards the front door — anyone with the password can manage everything. You can change it later from Settings.</p>
    `;
    document.getElementById('setPwBtn').onclick = ()=>{
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      const err = document.getElementById('gateErr');
      if(p1.length < 4){ err.textContent='Use at least 4 characters.'; err.style.display='block'; return; }
      if(p1 !== p2){ err.textContent='Passwords do not match.'; err.style.display='block'; return; }
      localStorage.setItem(LS_KEYS.pw, p1);
      unlock();
    };
  }else{
    card.innerHTML = `
      <div class="gate-mark">I</div>
      <p class="gate-eyebrow">Imaan Dental Centre</p>
      <h2 class="gate-title">Enter the password<br>to continue</h2>
      <div class="gate-error" id="gateErr"></div>
      <div class="field"><label>Password</label><input type="password" id="pwIn" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="loginBtn">Unlock</button>
      <p class="gate-foot">Front-desk access only. No accounts, no roles — just this one password.</p>
    `;
    const doLogin = ()=>{
      const val = document.getElementById('pwIn').value;
      const err = document.getElementById('gateErr');
      if(val === localStorage.getItem(LS_KEYS.pw)){ unlock(); }
      else{ err.textContent='That password is incorrect.'; err.style.display='block'; }
    };
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('pwIn').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    setTimeout(()=>document.getElementById('pwIn')?.focus(), 50);
  }
}

async function unlock(){
  sessionStorage.setItem('imaan_unlocked','1');
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  await boot();
}

function lock(){
  sessionStorage.removeItem('imaan_unlocked');
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  renderGate();
}

function toast(msg, isErr=false){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.innerHTML = `${ICONS.check}<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

async function renderTokens(){

  actions.innerHTML = `<button class="btn btn-primary" id="newTokenBtn">${ICONS.plus}New token</button>`;
  document.getElementById('newTokenBtn').onclick = ()=>openTokenModal();

  const today = todayStr();
  const all = await DB.tokens.list();
  const list = all.filter(t=>t.token_date===today).sort((a,b)=>a.token_number-b.token_number);

  const content = document.getElementById('content');
  const statusOptions = ['waiting','in-progress','done','cancelled'];

  content.innerHTML = `
    <div class="section-head"><h2>Today's queue — ${fmtDate(today)}</h2></div>
    ${list.length===0 ? emptyState('No tokens issued yet', 'Give the first walk-in of the day a token to start the queue.') : `
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr><th>Token</th><th>Patient</th><th>Status</th><th>Issued</th><th></th></tr></thead>
        <tbody>

            <tr>

              <td class="name-cell">${esc(t.patient_name || 'Walk-in')}</td>

                <select class="select status-select" data-id="${t.id}" style="padding:6px 10px;font-size:12.5px;">
                  ${statusOptions.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${s.replace('-',' ')}</option>`).join('')}
                </select>
              </td>
              <td class="muted">${new Date(t.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn del-token" data-id="${t.id}">${ICONS.trash}</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
  `;

  content.querySelectorAll('.status-select').forEach(sel=>{

  });

    b.onclick = async ()=>{ if(confirm('Remove this token?')){ await DB.tokens.remove(b.dataset.id); toast('Token removed.'); renderTokens(); } };
  });

async function openTokenModal(){
  const today = todayStr();
  const all = await DB.tokens.list();
  const todaysCount = all.filter(t=>t.token_date===today).length;
  const nextNum = todaysCount + 1;
  const options = await patientOptions();

  openModal(`
    <div class="modal-head"><h3>New token — #${String(nextNum).padStart(2,'0')}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="field"><label>Patient</label><select class="select" id="tkPatient" style="width:100%;">${options}</select></div>
    <div class="field"><label>Or type a walk-in name</label><input type="text" id="tkName" placeholder="Only if not selecting a patient above"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveTokenBtn">Issue token</button>
    </div>
  `);

  document.getElementById('saveTokenBtn').onclick = async ()=>{
    const patientSel = document.getElementById('tkPatient');
    const patientId = patientSel.value || null;
    const patientName = patientId ? patientSel.options[patientSel.selectedIndex].text.split(' — ')[0] : (document.getElementById('tkName').value.trim() || 'Walk-in');
    await DB.tokens.add({ token_number: nextNum, patient_id: patientId, patient_name: patientName, status:'waiting', token_date: today });
    toast(`Token #${String(nextNum).padStart(2,'0')} issued.`);
    closeModal();
    renderTokens();
  };
}

        <option value="Female" ${p?.gender==='Female'?'selected':''}>Female</option>
        <option value="Male" ${p?.gender==='Male'?'selected':''}>Male</option>
        <option value="Other" ${p?.gender==='Other'?'selected':''}>Other</option>
      </select>
    </div>
    <div class="field"><label>Address</label><input type="text" id="pAddress" value="${esc(p?.address||'')}" placeholder="Optional"></div>
    <div class="field"><label>Notes</label><textarea id="pNotes" placeholder="Allergies, history, preferences…">${esc(p?.notes||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-primary" id="savePatBtn">${isEdit?'Save changes':'Add patient'}</button>
    </div>
  `);
  document.getElementById('savePatBtn').onclick = async ()=>{
    const name = document.getElementById('pName').value.trim();
    if(!name){ toast('A name is needed to save this patient.', true); return; }
    const payload = {
      name, phone: document.getElementById('pPhone').value.trim(),
      age: document.getElementById('pAge').value ? Number(document.getElementById('pAge').value) : null,
      gender: document.getElementById('pGender').value,
      address: document.getElementById('pAddress').value.trim(),
      notes: document.getElementById('pNotes').value.trim(),
    };
    if(isEdit) await DB.patients.update(p.id, payload); else await DB.patients.add(payload);
    toast(isEdit ? 'Patient updated.' : 'Patient added.');
    closeModal();
    renderPatients();
  };
}

/* ============================================================
   APPOINTMENTS
============================================================ */
let apptFilter = 'upcoming';
async function renderAppointments(){
  const actions = document.getElementById('topbarActions');
  actions.innerHTML = `<button class="btn btn-primary" id="newApptBtn">${ICONS.plus}New appointment</button>`;
  document.getElementById('newApptBtn').onclick = ()=>openApptModal();

  const all = (await DB.appts.list()).sort((a,b)=> (a.appt_date+a.appt_time).localeCompare(b.appt_date+b.appt_time));
  const today = todayStr();
  const content = document.getElementById('content');

  const render = ()=>{
    let list = all;
    if(apptFilter==='upcoming') list = all.filter(a=>a.appt_date>=today && a.status!=='completed' && a.status!=='cancelled');
    else if(apptFilter==='today') list = all.filter(a=>a.appt_date===today);
    else if(apptFilter==='past') list = all.filter(a=>a.appt_date<today);

    content.innerHTML = `
      <div class="section-head">
        <h2>Appointments</h2>
        <div class="toolbar">
          <select class="select" id="apptFilterSel">
            <option value="upcoming" ${apptFilter==='upcoming'?'selected':''}>Upcoming</option>
            <option value="today" ${apptFilter==='today'?'selected':''}>Today</option>
            <option value="past" ${apptFilter==='past'?'selected':''}>Past</option>
            <option value="all" ${apptFilter==='all'?'selected':''}>All</option>
          </select>
        </div>
      </div>
      ${list.length===0 ? emptyState('Nothing here', 'No appointments match this filter.') : `
      <div class="card" style="padding:0;overflow:hidden;">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Reason</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${list.map(a=>`
              <tr>
                <td class="muted">${fmtDate(a.appt_date)}</td>
                <td style="font-family:var(--mono);font-size:12.5px;">${esc(a.appt_time||'—')}</td>
                <td class="name-cell">${esc(a.patient_name||'Walk-in')}</td>
                <td class="muted">${esc(a.reason||'—')}</td>
                <td class="muted">${a.doctor?'Dr. '+esc(a.doctor):'—'}</td>
                <td><span class="badge badge-${a.status==='completed'?'completed':a.status==='cancelled'?'cancelled':'scheduled'}">${a.status}</span></td>
                <td>
                  <div class="row-actions">
                    <button class="icon-btn edit-appt" data-id="${a.id}">${ICONS.edit}</button>
                    <button class="icon-btn del-appt" data-id="${a.id}">${ICONS.trash}</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`}
    `;
    document.getElementById('apptFilterSel').onchange = (e)=>{ apptFilter = e.target.value; render(); };
    content.querySelectorAll('.edit-appt').forEach(b=>b.onclick=()=>openApptModal(all.find(a=>a.id===b.dataset.id)));
    content.querySelectorAll('.del-appt').forEach(b=>b.onclick=async()=>{
      if(confirm('Cancel and remove this appointment?')){ await DB.appts.remove(b.dataset.id); toast('Appointment removed.'); renderAppointments(); }
    });
  };
  render();
}

async function openApptModal(a){
  const isEdit = !!a;
  const options = await patientOptions(a?.patient_id);
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit appointment':'New appointment'}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="field"><label>Patient</label><select class="select" id="aPatient" style="width:100%;">${options}</select></div>
    <div class="field"><label>Or type a name (walk-in / not on file)</label><input type="text" id="aName" value="${!a?.patient_id?esc(a?.patient_name||''):''}" placeholder="Only if not selected above"></div>
    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="aDate" value="${a?.appt_date||todayStr()}"></div>
      <div class="field"><label>Time</label><input type="time" id="aTime" value="${a?.appt_time||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Doctor</label><input type="text" id="aDoctor" value="${esc(a?.doctor||'')}" placeholder="e.g. Ayesha"></div>
      <div class="field"><label>Status</label>
        <select class="select" id="aStatus" style="width:100%;">
          <option value="scheduled" ${(!a||a.status==='scheduled')?'selected':''}>Scheduled</option>
          <option value="completed" ${a?.status==='completed'?'selected':''}>Completed</option>
          <option value="cancelled" ${a?.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Reason</label><input type="text" id="aReason" value="${esc(a?.reason||'')}" placeholder="e.g. Root canal, check-up"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveApptBtn">${isEdit?'Save changes':'Schedule'}</button>
    </div>
  `);
  document.getElementById('saveApptBtn').onclick = async ()=>{
    const patientSel = document.getElementById('aPatient');
    const patientId = patientSel.value || null;
    const typedName = document.getElementById('aName').value.trim();
    const patientName = patientId ? patientSel.options[patientSel.selectedIndex].text.split(' — ')[0] : (typedName || 'Walk-in');
    const date = document.getElementById('aDate').value;
    if(!date){ toast('Pick a date for this appointment.', true); return; }
    const payload = {
      patient_id: patientId, patient_name: patientName, appt_date: date,
      appt_time: document.getElementById('aTime').value, doctor: document.getElementById('aDoctor').value.trim(),
      reason: document.getElementById('aReason').value.trim(), status: document.getElementById('aStatus').value,
    };
    if(isEdit) await DB.appts.update(a.id, payload); else await DB.appts.add(payload);
    toast(isEdit?'Appointment updated.':'Appointment scheduled.');
    closeModal();
    renderAppointments();
  };
}

/* ============================================================
   PAYMENTS
============================================================ */
async function renderPayments(){
  const actions = document.getElementById('topbarActions');
  actions.innerHTML = `<button class="btn btn-primary" id="newPayBtn">${ICONS.plus}Record payment</button>`;
  document.getElementById('newPayBtn').onclick = ()=>openPaymentModal();

  const all = (await DB.payments.list()).sort((a,b)=> (b.pay_date+b.created_at).localeCompare(a.pay_date+a.created_at));
  const today = todayStr();
  const todayTotal = all.filter(p=>p.pay_date===today).reduce((s,p)=>s+Number(p.amount||0),0);
  const monthTotal = all.filter(p=>(p.pay_date||'').slice(0,7)===today.slice(0,7)).reduce((s,p)=>s+Number(p.amount||0),0);
  const allTotal = all.reduce((s,p)=>s+Number(p.amount||0),0);

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card stat-card"><div class="stat-label">Today</div><div class="stat-value">${fmtMoney(todayTotal)}</div></div>
      <div class="card stat-card"><div class="stat-label">This month</div><div class="stat-value">${fmtMoney(monthTotal)}</div></div>
      <div class="card stat-card"><div class="stat-label">All time</div><div class="stat-value">${fmtMoney(allTotal)}</div></div>
    </div>
    <div class="section-head"><h2>Payment history</h2></div>
    ${all.length===0 ? emptyState('No payments recorded', 'Record the first receipt to see it here.') : `
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr><th>Date</th><th>Patient</th><th>Mode</th><th>Notes</th><th style="text-align:right;">Amount</th><th></th></tr></thead>
        <tbody>
          ${all.map(p=>`
            <tr>
              <td class="muted">${fmtDate(p.pay_date)}</td>
              <td class="name-cell">${esc(p.patient_name||'Walk-in')}</td>
              <td><span class="badge badge-scheduled" style="text-transform:capitalize;">${esc(p.mode||'cash')}</span></td>
              <td class="muted">${esc(p.notes||'—')}</td>
              <td style="text-align:right;font-weight:700;">${fmtMoney(p.amount)}</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn del-pay" data-id="${p.id}">${ICONS.trash}</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  content.querySelectorAll('.del-pay').forEach(b=>b.onclick=async()=>{
    if(confirm('Delete this payment record?')){ await DB.payments.remove(b.dataset.id); toast('Payment removed.'); renderPayments(); }
  });
}

async function openPaymentModal(){
  const options = await patientOptions();
  openModal(`
    <div class="modal-head"><h3>Record payment</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="field"><label>Patient</label><select class="select" id="payPatient" style="width:100%;">${options}</select></div>
    <div class="field"><label>Or type a name</label><input type="text" id="payName" placeholder="Only if not selected above"></div>
    <div class="field-row">
      <div class="field"><label>Amount</label><input type="number" id="payAmount" placeholder="0" min="0"></div>
      <div class="field"><label>Mode</label>
        <select class="select" id="payMode" style="width:100%;">
          <option value="cash">Cash</option><option value="card">Card</option><option value="online">Online transfer</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Date</label><input type="date" id="payDate" value="${todayStr()}"></div>
    <div class="field"><label>Notes</label><input type="text" id="payNotes" placeholder="e.g. Advance for root canal"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-primary" id="savePayBtn">Save payment</button>
    </div>
  `);
  document.getElementById('savePayBtn').onclick = async ()=>{
    const patientSel = document.getElementById('payPatient');
    const patientId = patientSel.value || null;
    const typedName = document.getElementById('payName').value.trim();
    const patientName = patientId ? patientSel.options[patientSel.selectedIndex].text.split(' — ')[0] : (typedName || 'Walk-in');
    const amount = Number(document.getElementById('payAmount').value);
    if(!amount || amount<=0){ toast('Enter an amount greater than zero.', true); return; }
    await DB.payments.add({
      patient_id: patientId, patient_name: patientName, amount,
      mode: document.getElementById('payMode').value, pay_date: document.getElementById('payDate').value || todayStr(),
      notes: document.getElementById('payNotes').value.trim(),
    });
    toast('Payment recorded.');
    closeModal();
    renderPayments();
  };
}

/* ============================================================
   SETTINGS
============================================================ */
async function renderSettings(){
  document.getElementById('topbarActions').innerHTML = '';
  const url = localStorage.getItem(LS_KEYS.sbUrl) || '';
  const key = localStorage.getItem(LS_KEYS.sbKey) || '';
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="grid grid-2">
      <div>
        <div class="card settings-block">
          <h3>Database connection</h3>
          <p class="desc">Currently ${dbMode==='supabase' ? 'connected to Supabase.' : "running on this browser's local storage — nothing is synced elsewhere until Supabase connects."}</p>
          <div class="field"><label>Supabase project URL</label><input type="text" id="sbUrlIn" value="${esc(url)}" placeholder="https://xxxxx.supabase.co"></div>
          <div class="field"><label>Supabase anon public key</label><input type="text" id="sbKeyIn" value="${esc(key)}" placeholder="eyJhbGciOi..."></div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" id="testConnBtn" style="flex:1;">Save &amp; test connection</button>
            <button class="btn btn-ghost" id="clearConnBtn">Use local only</button>
          </div>
        </div>

        <div class="card settings-block">
          <h3>Change password</h3>
          <p class="desc">This is the single password that unlocks the site on this and any device you type it into.</p>
          <div class="field"><label>New password</label><input type="password" id="newPwIn" placeholder="Choose a new password"></div>
          <button class="btn btn-ghost" id="changePwBtn">Update password</button>
        </div>
      </div>

      <div class="card settings-block">
        <h3>Table setup for Supabase</h3>
        <p class="desc">Run this once in your Supabase project's SQL editor. Row-level security is left off, matching the "password only" access model of this site.</p>
        <div class="code-block">create table patients (
  id uuid primary key,
  name text not null,
  phone text,
  age int,
  gender text,
  address text,
  notes text,
  created_at timestamptz default now()
);

create table tokens (
  id uuid primary key,
  token_number int not null,
  patient_id uuid references patients(id) on delete set null,
  patient_name text,
  status text default 'waiting',
  token_date date not null,
  created_at timestamptz default now()
);

create table appointments (
  id uuid primary key,
  patient_id uuid references patients(id) on delete set null,
  patient_name text,
  appt_date date not null,
  appt_time text,
  doctor text,
  reason text,
  status text default 'scheduled',
  created_at timestamptz default now()
);

create table payments (
  id uuid primary key,
  patient_id uuid references patients(id) on delete set null,
  patient_name text,
  amount numeric not null,
  mode text default 'cash',
  pay_date date not null,
  notes text,
  created_at timestamptz default now()
);</div>
        <button class="btn btn-ghost btn-sm" id="copySqlBtn" style="margin-top:12px;">Copy SQL</button>
      </div>
    </div>
  `;

  document.getElementById('testConnBtn').onclick = async ()=>{
    const u = document.getElementById('sbUrlIn').value.trim();
    const k = document.getElementById('sbKeyIn').value.trim();
    if(!u || !k){ toast('Enter both the URL and the anon key.', true); return; }
    localStorage.setItem(LS_KEYS.sbUrl, u);
    localStorage.setItem(LS_KEYS.sbKey, k);
    toast('Testing connection…');
    await tryConnect();
    toast(dbMode==='supabase' ? 'Connected to Supabase.' : 'Could not connect — staying on local storage.', dbMode!=='supabase');
    renderSettings();
  };
  document.getElementById('clearConnBtn').onclick = ()=>{
    localStorage.removeItem(LS_KEYS.sbUrl); localStorage.removeItem(LS_KEYS.sbKey);
    sbClient = null; dbMode = 'local'; updateConnPill();
    toast('Switched to local storage only.');
    renderSettings();
  };
  document.getElementById('changePwBtn').onclick = ()=>{
    const v = document.getElementById('newPwIn').value;
    if(v.length<4){ toast('Use at least 4 characters.', true); return; }
    localStorage.setItem(LS_KEYS.pw, v);
    toast('Password updated.');
    document.getElementById('newPwIn').value='';
  };
  document.getElementById('copySqlBtn').onclick = ()=>{
    navigator.clipboard.writeText(document.querySelector('.code-block').innerText);
    toast('SQL copied to clipboard.');
  };
}

/* ============================================================
   MISC UI
============================================================ */
function emptyState(title, sub){
  return `<div class="card empty">${ICONS.empty}<div class="empty-title">${esc(title)}</div><p>${esc(sub)}</p></div>`;
}

window.__closeModal = closeModal;

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  await tryConnect();
  renderNav();
  await goto('dashboard');
}

document.getElementById('lockBtn').addEventListener('click', lock);
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
});
document.getElementById('backdrop').addEventListener('click', closeMobileNav);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* Init */
renderGate();
if(sessionStorage.getItem('imaan_unlocked')==='1'){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  boot();
}
</script>
</body>
