<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imaan Dental Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
/* ==========================================================
   Imaan Dental Centre — design tokens
   Palette: mint mist #EAF6F4, sky mist #EDF3FB, deep teal ink #163832,
   signal teal #2FA8A0, warm coral #F2836B, amber #E8A93B,
   leaf green #3FAE6B, clay red #E1594C
   Type: Fraunces (display) / Plus Jakarta Sans (body) / IBM Plex Mono (data)
   ========================================================== */

:root{
  --bg-1:#EAF6F4;
  --bg-2:#EDF3FB;
  --bg-3:#F7EFEA;
  --glass:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --ink:#163832;
  --ink-soft:#4B6863;
  --ink-faint:#8AA3A0;
  --teal:#2FA8A0;
  --teal-deep:#1E7D77;
  --coral:#F2836B;
  --coral-deep:#D9663E;
  --amber:#E8A93B;
  --green:#3FAE6B;
  --red:#E1594C;
  --radius-lg:26px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-glass:0 8px 32px rgba(22,56,50,.10), 0 1.5px 0 rgba(255,255,255,.6) inset;
  --shadow-pop:0 16px 40px rgba(22,56,50,.16);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 12%, rgba(47,168,160,.18), transparent 42%),
    radial-gradient(circle at 92% 8%, rgba(242,131,107,.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(47,168,160,.10), transparent 45%),
    linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 55%, var(--bg-3) 100%);
  background-attachment:fixed;
}

h1,h2,h3,h4,.display{
  font-family:'Fraunces', serif;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--ink);
  margin:0 0 .3em;
}

.mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:.02em; }

a{color:var(--teal-deep);}
p{line-height:1.55; color:var(--ink-soft);}

::selection{ background:rgba(47,168,160,.28); }

/* ---------- glass primitives ---------- */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:var(--shadow-glass);
}
.glass-strong{
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow-glass);
}

/* ---------- buttons ---------- */
button{ font-family:inherit; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:999px; border:1px solid transparent;
  font-weight:600; font-size:14px; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#fff; box-shadow:0 8px 20px rgba(47,168,160,.35);}
.btn-primary:hover{ box-shadow:0 10px 26px rgba(47,168,160,.45); }
.btn-coral{ background:linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; box-shadow:0 8px 20px rgba(242,131,107,.35);}
.btn-ghost{ background:var(--glass-strong); border-color:var(--glass-border); color:var(--ink); }
.btn-ghost:hover{ background:#fff; }
.btn-sm{ padding:6px 12px; font-size:12.5px; }
.btn-danger{ background:rgba(225,89,76,.12); color:var(--red); border-color:rgba(225,89,76,.25); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---------- app shell ---------- */
.shell{ display:flex; min-height:100vh; }

.sidebar{
  width:236px; flex-shrink:0; margin:18px; padding:22px 16px;
  display:flex; flex-direction:column; gap:6px;
  position:sticky; top:18px; align-self:flex-start; height:calc(100vh - 36px);
}
.brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 22px; }
.brand-mark{
  width:38px; height:38px; border-radius:12px;
  background:linear-gradient(135deg, var(--teal), var(--coral));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:18px;
  box-shadow:0 6px 16px rgba(47,168,160,.35);
}
.brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.1; }
.brand-sub{ font-size:11px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; }

.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:var(--radius-sm);
  color:var(--ink-soft); text-decoration:none; font-weight:600; font-size:14px;
  cursor:pointer; transition:background .15s, color .15s;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; }
.nav-item:hover{ background:rgba(255,255,255,.5); color:var(--ink); }
.nav-item.active{ background:var(--glass-strong); color:var(--teal-deep); box-shadow:var(--shadow-glass); }

.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(22,56,50,.08); }
.who{ font-size:12.5px; color:var(--ink-faint); padding:8px 10px 4px;}

.main{ flex:1; padding:22px 26px 40px; min-width:0; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:22px; gap:14px; flex-wrap:wrap;
}
.page-title{ font-size:26px; }
.page-sub{ color:var(--ink-faint); font-size:13.5px; margin-top:-6px; }

/* ---------- now-serving ticker (signature element) ---------- */
.ticker{
  display:flex; align-items:center; gap:18px;
  padding:14px 22px; border-radius:999px;
  min-width:260px;
}
.ticker-label{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
.ticker-num{ font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; color:var(--teal-deep); }
.ticker-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
.ticker-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(63,174,107,.2); animation:pulse 1.8s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* ---------- grid & cards ---------- */
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.card{ padding:20px; }
.stat-card{ padding:18px 20px; }
.stat-label{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
.stat-value{ font-family:'Fraunces',serif; font-size:30px; margin-top:4px; }
.stat-delta{ font-size:12px; margin-top:4px; }
.up{ color:var(--green); } .down{ color:var(--red); }

.section{ margin-bottom:26px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}

/* ---------- table ---------- */
.table-wrap{ overflow-x:auto; border-radius:var(--radius-md); }
table{ width:100%; border-collapse:collapse; font-size:14px; }
thead th{
  text-align:left; padding:12px 14px; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid rgba(22,56,50,.1);
}
tbody td{ padding:12px 14px; border-bottom:1px solid rgba(22,56,50,.06); color:var(--ink); vertical-align:middle;}
tbody tr:hover{ background:rgba(255,255,255,.4); }
tbody tr:last-child td{ border-bottom:none; }

.badge{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
  font-size:11.5px; font-weight:700; letter-spacing:.02em;
}
.badge-teal{ background:rgba(47,168,160,.14); color:var(--teal-deep); }
.badge-coral{ background:rgba(242,131,107,.16); color:var(--coral-deep); }
.badge-amber{ background:rgba(232,169,59,.16); color:#93691C; }
.badge-green{ background:rgba(63,174,107,.16); color:#1F7A45; }
.badge-red{ background:rgba(225,89,76,.14); color:var(--red); }
.badge-gray{ background:rgba(75,104,99,.12); color:var(--ink-soft); }

/* ---------- forms ---------- */
label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px; }
input,select,textarea{
  width:100%; padding:10px 13px; border-radius:var(--radius-sm);
  border:1px solid rgba(22,56,50,.15); background:rgba(255,255,255,.7);
  font-family:inherit; font-size:14px; color:var(--ink); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(47,168,160,.18); }
textarea{ resize:vertical; min-height:70px; }
.field{ margin-bottom:14px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:600px){ .field-row{ grid-template-columns:1fr; } }

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(22,56,50,.28); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
}
.modal{ width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:26px; }
.modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.modal-close{ cursor:pointer; background:none; border:none; font-size:20px; color:var(--ink-faint); }

/* ---------- misc ---------- */
.empty{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
.empty svg{ opacity:.5; margin-bottom:10px; }
.searchbar{ display:flex; gap:10px; align-items:center; }
.searchbar input{ max-width:280px; }
.pill-group{ display:flex; gap:8px; flex-wrap:wrap; }
.pill-filter{
  padding:7px 14px; border-radius:999px; border:1px solid rgba(22,56,50,.14);
  background:var(--glass); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.pill-filter.active{ background:var(--teal); color:#fff; border-color:var(--teal); }
.toast{
  position:fixed; bottom:24px; right:24px; padding:14px 20px; border-radius:14px;
  z-index:200; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-pop);
  animation:slideIn .25s ease;
}
@keyframes slideIn{ from{ transform:translateY(14px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.wa-icon{ width:15px; height:15px; }
.avatar{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--teal), var(--coral)); color:#fff; font-weight:700; font-size:13px; flex-shrink:0;
}
.row-flex{ display:flex; align-items:center; gap:10px; }
.hint{ font-size:12px; color:var(--ink-faint); margin-top:4px; }

/* scrollbar */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:rgba(22,56,50,.18); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

@media (max-width:900px){
  .shell{ flex-direction:column; }
  .sidebar{ width:auto; height:auto; position:relative; margin:12px; flex-direction:row; overflow-x:auto; align-items:center; }
  .sidebar-foot{ display:none; }
  .brand{ padding-bottom:0; }
  .nav-item span{ display:none; }
  .main{ padding:14px 14px 40px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

/* ---------- offline-mode banner ---------- */
#offline-banner{
  display:none; position:sticky; top:0; z-index:300;
  background:linear-gradient(135deg, var(--amber), #cf8f2c); color:#fff;
  font-size:13px; font-weight:600; padding:10px 18px;
  text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.1);
}
#offline-banner a{ color:#fff; text-decoration:underline; margin-left:10px; cursor:pointer; }
</style>

<script>
// ==========================================================
// Supabase connection
// Get these two values from: Supabase Dashboard → Project
// Settings → API. The "anon public" key is safe to put in
// client-side code — it only works within your RLS policies.
// ==========================================================
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

// ==========================================================
// Offline / local-storage fallback
//
// If Supabase isn't configured yet, or the browser can't reach
// it (no internet, project paused, wrong URL, etc.), the app
// automatically switches to a local backend that stores every
// table in this browser's localStorage instead. The rest of the
// app (whatsapp.js, app.js) talks to a single `supabase` object
// and never needs to know which mode it's in — every method it
// calls (`.from(table).select()/.insert()/...`) exists in both
// modes with the same shape.
//
// Notes on the local mode:
//  - Data lives only in this browser (this device, this browser
//    profile). It is NOT synced to Supabase and is NOT shared
//    between staff members' computers.
//  - Once back online, reload the page — the app will retry a
//    real Supabase connection from scratch. It does not attempt
//    to merge or migrate local data into Supabase automatically.
//
// This app has no login screen — anyone who can open the page
// can read and write all clinic data. See the note further down
// about what that means for your Supabase RLS policies.
// ==========================================================

const LOCAL_DB_PREFIX = "imaan_local_db_v1_";
let OFFLINE_MODE = false;

function uuid() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}

function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("Request timed out")), ms);
    Promise.resolve(promise).then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
  });
}

function isNetworkish(err) {
  if (!err) return false;
  const msg = ((err.message || String(err)) + "").toLowerCase();
  return msg.includes("fetch") || msg.includes("network") || msg.includes("timed out") ||
    msg.includes("timeout") || msg.includes("failed to fetch") || err.name === "AbortError" || err.name === "TypeError";
}

function goOffline(reason) {
  if (OFFLINE_MODE) return;
  OFFLINE_MODE = true;
  console.info("[Imaan Dental] Switching to offline/local-storage mode:", reason || "");
  const banner = document.getElementById("offline-banner");
  if (banner) banner.style.display = "block";
  const reload = document.getElementById("offline-reload");
  if (reload) reload.onclick = () => location.reload();
}

// ---------- local table storage ----------
function readTable(table) {
  try {
    const raw = localStorage.getItem(LOCAL_DB_PREFIX + table);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function writeTable(table, rows) {
  try { localStorage.setItem(LOCAL_DB_PREFIX + table, JSON.stringify(rows)); } catch (e) { console.error("Local storage write failed", e); }
}
function ensureSeed(table) {
  if (table === "whatsapp_settings") {
    const rows = readTable(table);
    if (!rows.length) {
      writeTable(table, [{
        id: 1, business_display_name: "Imaan Dental Centre", default_country_code: "+1",
        confirmation_template: "Hi {{patient_name}}, this is Imaan Dental Centre confirming your appointment on {{date}} at {{time}} with {{staff_name}}. Reply YES to confirm or call us to reschedule.",
        send_mode: "link",
      }]);
    }
  }
}

// belongsTo: child.fk === parent.id, attaches a single object
// hasMany:   child.fk === parent.id, attaches an array
const RELATIONS = {
  appointments: {
    patients: { type: "belongsTo", fk: "patient_id", table: "patients" },
    staff: { type: "belongsTo", fk: "staff_id", table: "staff" },
    procedures: { type: "belongsTo", fk: "procedure_id", table: "procedures" },
  },
  tokens: {
    patients: { type: "belongsTo", fk: "patient_id", table: "patients" },
  },
  invoices: {
    patients: { type: "belongsTo", fk: "patient_id", table: "patients" },
    invoice_items: { type: "hasMany", fk: "invoice_id", table: "invoice_items" },
    payments: { type: "hasMany", fk: "invoice_id", table: "payments" },
  },
};

function embedRow(row, table, selectCols) {
  const rel = RELATIONS[table];
  if (!rel || !selectCols) return { ...row };
  const out = { ...row };
  const re = /([a-zA-Z_]+)\(([^()]*)\)/g;
  let m;
  while ((m = re.exec(selectCols))) {
    const relName = m[1];
    const def = rel[relName];
    if (!def) continue;
    if (def.type === "belongsTo") {
      const related = readTable(def.table).find((r) => r.id === row[def.fk]);
      out[relName] = related ? { ...related } : null;
    } else if (def.type === "hasMany") {
      out[relName] = readTable(def.table).filter((r) => r[def.fk] === row.id).map((r) => ({ ...r }));
    }
  }
  return out;
}

function parseOrCond(str) {
  const m = str.match(/^([a-zA-Z0-9_]+)\.([a-zA-Z]+)\.(.*)$/);
  if (!m) return null;
  return { col: m[1], op: m[2], val: m[3] };
}

function applyFilters(rows, filters) {
  let out = rows;
  filters.forEach((f) => {
    if (f.type === "eq") {
      out = out.filter((r) => r[f.col] == f.val);
    } else if (f.type === "or") {
      const conds = f.str.split(",").map(parseOrCond).filter(Boolean);
      out = out.filter((r) => conds.some((c) => {
        if (c.op === "ilike") {
          const needle = c.val.replace(/%/g, "").toLowerCase();
          return String(r[c.col] || "").toLowerCase().includes(needle);
        }
        return String(r[c.col]) === c.val;
      }));
    }
  });
  return out;
}

function applyOrder(rows, orders) {
  if (!orders.length) return rows;
  return rows.slice().sort((a, b) => {
    for (const o of orders) {
      const av = a[o.col], bv = b[o.col];
      if (av == null && bv == null) continue;
      if (av == null) return o.ascending ? -1 : 1;
      if (bv == null) return o.ascending ? 1 : -1;
      if (av < bv) return o.ascending ? -1 : 1;
      if (av > bv) return o.ascending ? 1 : -1;
    }
    return 0;
  });
}

// ---------- unified query builder ----------
class UniversalQuery {
  constructor(table, liveClient) {
    this.table = table;
    this.liveClient = liveClient;
    this.operation = null;
    this.filters = [];
    this.orders = [];
    this.selectCols = null;
    this.countMode = null;
    this.headMode = null;
    this.singleMode = null;
    this.payload = null;
    this.wantsSelect = false;
  }
  select(cols, opts) {
    if (this.operation === "insert" || this.operation === "update") {
      this.wantsSelect = true;
      if (cols) this.selectCols = cols;
    } else {
      this.operation = this.operation || "select";
      this.selectCols = cols || "*";
      if (opts) { this.countMode = opts.count || null; this.headMode = !!opts.head; }
    }
    return this;
  }
  eq(col, val) { this.filters.push({ type: "eq", col, val }); return this; }
  or(str) { this.filters.push({ type: "or", str }); return this; }
  order(col, opts = {}) { this.orders.push({ col, ascending: opts.ascending !== false }); return this; }
  maybeSingle() { this.singleMode = "maybe"; return this; }
  single() { this.singleMode = "single"; return this; }
  insert(obj) { this.operation = "insert"; this.payload = obj; return this; }
  update(obj) { this.operation = "update"; this.payload = obj; return this; }
  delete() { this.operation = "delete"; return this; }

  async _execLocal() {
    ensureSeed(this.table);
    let table = readTable(this.table);

    if (this.operation === "insert") {
      const rows = Array.isArray(this.payload) ? this.payload : [this.payload];
      const inserted = rows.map((r) => ({ id: uuid(), created_at: new Date().toISOString(), ...r }));
      writeTable(this.table, [...table, ...inserted]);
      let data = inserted;
      if (this.wantsSelect) data = data.map((r) => embedRow(r, this.table, this.selectCols));
      if (this.singleMode) data = data[0] || null;
      return { data, error: null };
    }
    if (this.operation === "update") {
      const matched = applyFilters(table, this.filters);
      const matchedIds = new Set(matched.map((r) => r.id));
      table = table.map((r) => (matchedIds.has(r.id) ? { ...r, ...this.payload } : r));
      writeTable(this.table, table);
      let data = table.filter((r) => matchedIds.has(r.id));
      if (this.singleMode) data = data[0] || null;
      return { data, error: null };
    }
    if (this.operation === "delete") {
      const matched = applyFilters(table, this.filters);
      const matchedIds = new Set(matched.map((r) => r.id));
      writeTable(this.table, table.filter((r) => !matchedIds.has(r.id)));
      return { data: null, error: null };
    }

    // select
    let rows = applyFilters(table, this.filters);
    rows = applyOrder(rows, this.orders);
    const count = rows.length;
    let data;
    if (this.headMode) {
      data = null;
    } else {
      data = rows.map((r) => embedRow(r, this.table, this.selectCols));
      if (this.singleMode === "single") data = data[0] || null;
      else if (this.singleMode === "maybe") data = data[0] || null;
    }
    return { data, error: null, count };
  }

  _buildLive() {
    let q;
    if (this.operation === "insert") q = this.liveClient.from(this.table).insert(this.payload);
    else if (this.operation === "update") q = this.liveClient.from(this.table).update(this.payload);
    else if (this.operation === "delete") q = this.liveClient.from(this.table).delete();
    else {
      const opts = {};
      if (this.countMode) opts.count = this.countMode;
      if (this.headMode) opts.head = this.headMode;
      q = this.liveClient.from(this.table).select(this.selectCols || "*", Object.keys(opts).length ? opts : undefined);
    }
    this.filters.forEach((f) => {
      if (f.type === "eq") q = q.eq(f.col, f.val);
      else if (f.type === "or") q = q.or(f.str);
    });
    this.orders.forEach((o) => { q = q.order(o.col, { ascending: o.ascending }); });
    if (this.operation === "insert" && this.wantsSelect) q = q.select(this.selectCols || undefined);
    if (this.singleMode === "single") q = q.single();
    if (this.singleMode === "maybe") q = q.maybeSingle();
    return q;
  }

  then(resolve, reject) {
    this._run().then(resolve, reject);
  }

  async _run() {
    if (OFFLINE_MODE) return this._execLocal();
    try {
      const res = await withTimeout(this._buildLive(), 8000);
      if (res && res.error && isNetworkish(res.error)) {
        goOffline(res.error.message);
        return this._execLocal();
      }
      return res;
    } catch (err) {
      goOffline(err?.message || "network error");
      return this._execLocal();
    }
  }
}

// ---------- assemble the unified `supabase` object ----------
let liveSupabaseClient = null;
const looksConfigured = !SUPABASE_URL.includes("YOUR-PROJECT-REF") && !SUPABASE_ANON_KEY.includes("YOUR-ANON-PUBLIC-KEY");

if (looksConfigured) {
  try {
    liveSupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    goOffline("invalid Supabase URL/key: " + e.message);
  }
} else {
  goOffline("Supabase URL/key not configured");
}

// IMPORTANT: there is no login screen in this app anymore, so every
// request goes out using only the anon key — no per-user session.
// The original Supabase RLS policies (in supabase/schema.sql) only
// allow rows to be read/written by `auth.role() = 'authenticated'`,
// which means an anonymous request will be rejected with a
// permission error once you're on real Supabase (not this local
// fallback). To make the app actually work against Supabase without
// a login step, update those policies to allow the anon role too,
// e.g. for each table:
//
//   drop policy "authenticated_full_access_<table>" on <table>;
//   create policy "anon_full_access_<table>" on <table>
//     for all using (true) with check (true);
//
// Do this deliberately — it means anyone with the page URL can
// read and write all clinic data (patients, billing, etc.), since
// nothing else is gating access. That's fine for a private/internal
// tool but worth knowing before you deploy it.
const supabase = {
  from(table) { return new UniversalQuery(table, liveSupabaseClient); },
};

<script>
// ==========================================================
// WhatsApp confirmations
//
// Two modes, controlled by whatsapp_settings.send_mode:
//
//  "link"  (default, works immediately, no setup)
//    Builds a wa.me deep link with the message pre-filled.
//    Clicking it opens WhatsApp (desktop/web/app) with your
//    connected WhatsApp Business number, ready to hit send.
//    This is what "I will link WhatsApp business" refers to —
//    just open WhatsApp Web/Desktop and log it into your
//    clinic's WhatsApp Business account once; every link this
//    app generates will send from that account.
//
//  "api"   (optional, fully automatic sending)
//    Calls a Supabase Edge Function ("send-whatsapp") that
//    talks to the official WhatsApp Cloud API using a token
//    stored as a server-side secret. See
//    supabase/functions/send-whatsapp for the template and
//    supabase/README section on enabling it.
// ==========================================================

function fillTemplate(template, vars) {
  return template.replace(/\{\{(\w+)\}\}/g, (_, key) => vars[key] ?? "");
}

function normalizePhone(phone, defaultCountryCode) {
  let p = (phone || "").replace(/[^\d+]/g, "");
  if (!p) return "";
  if (p.startsWith("00")) p = "+" + p.slice(2);
  if (!p.startsWith("+")) p = (defaultCountryCode || "+1") + p.replace(/^0+/, "");
  return p.replace("+", "");
}

/**
 * Builds the message text + wa.me link for an appointment confirmation.
 */
function buildConfirmationMessage({ patientName, phone, date, time, staffName, template, defaultCountryCode }) {
  const text = fillTemplate(template, {
    patient_name: patientName,
    date, time,
    staff_name: staffName || "our team",
  });
  const digits = normalizePhone(phone, defaultCountryCode);
  const link = `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
  return { text, link, digits };
}

/**
 * Sends via the optional Edge Function (API mode). Returns {ok, error}.
 */
async function sendViaWhatsAppApi({ phone, text, defaultCountryCode }) {
  try {
    const digits = normalizePhone(phone, defaultCountryCode);
    // No user auth in this app anymore — the Edge Function is called
    // with the Supabase anon key instead of a per-user session token.
    // Make sure supabase/functions/send-whatsapp is deployed with
    // --no-verify-jwt, or verifies the apikey header itself.
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-whatsapp`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ to: digits, text }),
    });
    if (!res.ok) {
      const err = await res.text();
      return { ok: false, error: err };
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}
</script>
<script>
// ==========================================================
// Imaan Dental Centre — app.js
// Single-page app: hash router + Supabase CRUD for every module.
// No login required — the app opens straight to the dashboard.
// ==========================================================

let WA_SETTINGS = null;

const app = document.getElementById("app");
const modalRoot = document.getElementById("modal-root");
const toastRoot = document.getElementById("toast-root");

// ---------------------------------------------------------
// Boot straight into the app — no sign-in step.
// ---------------------------------------------------------
(async function boot() {
  const { data: waRow } = await supabase.from("whatsapp_settings").select("*").eq("id", 1).maybeSingle();
  WA_SETTINGS = waRow || { business_display_name: "Imaan Dental Centre", default_country_code: "+1", confirmation_template: "Hi {{patient_name}}, this is Imaan Dental Centre confirming your appointment on {{date}} at {{time}} with {{staff_name}}.", send_mode: "link" };
  router();
})();

// ---------------------------------------------------------
// Toast
// ---------------------------------------------------------
function toast(msg, kind = "ok") {
  const bg = kind === "ok" ? "background:linear-gradient(135deg,#2FA8A0,#1E7D77); color:#fff;"
    : kind === "err" ? "background:linear-gradient(135deg,#E1594C,#c94236); color:#fff;"
    : "background:#fff; color:#163832;";
  const el = document.createElement("div");
  el.className = "toast";
  el.style.cssText = bg;
  el.textContent = msg;
  toastRoot.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ---------------------------------------------------------
// Modal helpers
// ---------------------------------------------------------
function closeModal() { modalRoot.innerHTML = ""; }

function openModalRaw(innerHtml, onMount) {
  modalRoot.innerHTML = `<div class="modal-overlay" id="overlay"><div class="glass modal">${innerHtml}</div></div>`;
  document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  if (onMount) onMount();
}

/**
 * Generic form modal.
 * fields: [{name, label, type: text|tel|email|date|time|number|select|textarea|checkbox, options?:[{value,label}], required?, step?, placeholder?}]
 */
function formModal({ title, fields, initial = {}, submitLabel = "Save", onSubmit, extraHtml = "" }) {
  const fieldHtml = fields.map(f => {
    const val = initial[f.name] ?? "";
    if (f.type === "select") {
      return `<div class="field"><label>${f.label}</label>
        <select name="${f.name}" ${f.required ? "required" : ""}>
          ${f.placeholder ? `<option value="">${f.placeholder}</option>` : ""}
          ${f.options.map(o => `<option value="${o.value}" ${String(val) === String(o.value) ? "selected" : ""}>${o.label}</option>`).join("")}
        </select></div>`;
    }
    if (f.type === "textarea") {
      return `<div class="field"><label>${f.label}</label><textarea name="${f.name}" placeholder="${f.placeholder || ""}">${val}</textarea></div>`;
    }
    if (f.type === "checkbox") {
      return `<div class="field row-flex"><input type="checkbox" name="${f.name}" style="width:auto;" ${val ? "checked" : ""}><label style="margin:0;">${f.label}</label></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input type="${f.type}" name="${f.name}" value="${val ?? ""}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""} ${f.step ? `step="${f.step}"` : ""}></div>`;
  }).join("");

  openModalRaw(`
    <div class="modal-head"><h3 style="margin:0;">${title}</h3><button class="modal-close" id="mclose">&times;</button></div>
    <form id="mform">
      ${fieldHtml}
      ${extraHtml}
      <div class="row-flex" style="justify-content:flex-end; margin-top:18px; gap:10px;">
        <button type="button" class="btn btn-ghost" id="mcancel">Cancel</button>
        <button type="submit" class="btn btn-primary">${submitLabel}</button>
      </div>
    </form>
  `, () => {
    document.getElementById("mclose").onclick = closeModal;
    document.getElementById("mcancel").onclick = closeModal;
    document.getElementById("mform").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const values = {};
      fields.forEach(f => {
        if (f.type === "checkbox") { values[f.name] = fd.get(f.name) === "on"; }
        else if (f.type === "number") { values[f.name] = fd.get(f.name) === "" ? null : Number(fd.get(f.name)); }
        else { values[f.name] = fd.get(f.name) || null; }
      });
      await onSubmit(values);
    });
  });
}

function confirmModal(message, onConfirm) {
  openModalRaw(`
    <div class="modal-head"><h3 style="margin:0;">Are you sure?</h3><button class="modal-close" id="mclose">&times;</button></div>
    <p>${message}</p>
    <div class="row-flex" style="justify-content:flex-end; gap:10px;">
      <button class="btn btn-ghost" id="mcancel">Cancel</button>
      <button class="btn btn-danger" id="mconfirm">Delete</button>
    </div>
  `, () => {
    document.getElementById("mclose").onclick = closeModal;
    document.getElementById("mcancel").onclick = closeModal;
    document.getElementById("mconfirm").onclick = async () => { await onConfirm(); };
  });
}

// ---------------------------------------------------------
// Formatters
// ---------------------------------------------------------
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "—";
const fmtTime = (t) => { if (!t) return "—"; const [h, m] = t.split(":"); const hh = ((+h + 11) % 12) + 1; return `${hh}:${m} ${+h < 12 ? "AM" : "PM"}`; };
const initials = (name) => (name || "?").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
const todayStr = () => new Date().toISOString().slice(0, 10);

function badge(text, cls) { return `<span class="badge badge-${cls}">${text}</span>`; }
const statusBadge = (status) => {
  const map = {
    scheduled: "gray", confirmed: "teal", completed: "green", cancelled: "red", no_show: "amber",
    waiting: "amber", called: "teal", in_progress: "coral", done: "green", skipped: "red",
    unpaid: "red", partial: "amber", paid: "green", void: "gray",
  };
  return badge(status.replace("_", " "), map[status] || "gray");
};

// ---------------------------------------------------------
// Router
// ---------------------------------------------------------
const ROUTES = {
  dashboard: renderDashboard,
  patients: renderPatients,
  appointments: renderAppointments,
  tokens: renderTokens,
  procedures: renderProcedures,
  billing: renderBilling,
  expenses: renderExpenses,
  staff: renderStaff,
  settings: renderSettings,
};

function router() {
  const route = (location.hash || "#dashboard").slice(1);
  document.querySelectorAll(".nav-item[data-route]").forEach(n => n.classList.toggle("active", n.dataset.route === route));
  app.innerHTML = `<div class="empty">Loading…</div>`;
  (ROUTES[route] || renderDashboard)();
}
window.addEventListener("hashchange", router);
document.querySelectorAll(".nav-item[data-route]").forEach(n => {
  n.addEventListener("click", () => { location.hash = "#" + n.dataset.route; });
});

function pageHead(title, sub, actionsHtml = "") {
  return `<div class="topbar">
    <div><h1 class="page-title">${title}</h1>${sub ? `<div class="page-sub">${sub}</div>` : ""}</div>
    <div class="row-flex">${actionsHtml}</div>
  </div>`;
}

// ==========================================================
// DASHBOARD
// ==========================================================
async function renderDashboard() {
  const today = todayStr();
  const [{ data: apptsToday }, { count: patientCount }, { data: invoicesToday }, { data: queue }] = await Promise.all([
    supabase.from("appointments").select("*, patients(full_name), staff(full_name), procedures(name)").eq("appointment_date", today).order("start_time"),
    supabase.from("patients").select("id", { count: "exact", head: true }),
    supabase.from("invoices").select("id, discount, tax_percent, invoice_items(quantity, unit_price)").eq("issue_date", today),
    supabase.from("tokens").select("*, patients(full_name)").eq("queue_date", today).order("token_number"),
  ]);
  // patientCount now comes straight from the head-count query above —
  // previously this always silently fired a second, redundant request
  // because `data` is null in head mode, so `patients?.length` was
  // always undefined and the fallback fired on every dashboard load.
  const revenueToday = (invoicesToday || []).reduce((sum, inv) => {
    const sub = (inv.invoice_items || []).reduce((s, it) => s + it.quantity * it.unit_price, 0);
    const afterDiscount = sub - Number(inv.discount || 0);
    return sum + afterDiscount + afterDiscount * (Number(inv.tax_percent || 0) / 100);
  }, 0);

  const nowServing = (queue || []).find(t => t.status === "called" || t.status === "in_progress");
  const waiting = (queue || []).filter(t => t.status === "waiting").length;

  app.innerHTML = `
    ${pageHead("Good day", `Here's what's happening at the clinic — ${fmtDate(today)}`,
      `<div class="glass ticker">
        <span class="ticker-dot"></span>
        <div>
          <div class="ticker-label">Now serving</div>
          <div class="ticker-num">${nowServing ? String(nowServing.token_number).padStart(2, "0") : "—"}</div>
        </div>
        <div style="border-left:1px solid rgba(22,56,50,.12); padding-left:16px;">
          <div class="ticker-label">Patient</div>
          <div class="ticker-name">${nowServing ? nowServing.patients.full_name : "No one called yet"}</div>
        </div>
      </div>`)}

    <div class="grid grid-4 section">
      <div class="glass stat-card"><div class="stat-label">Appointments today</div><div class="stat-value">${apptsToday?.length ?? 0}</div></div>
      <div class="glass stat-card"><div class="stat-label">Patients waiting</div><div class="stat-value">${waiting}</div></div>
      <div class="glass stat-card"><div class="stat-label">Billed today</div><div class="stat-value">${money(revenueToday)}</div></div>
      <div class="glass stat-card"><div class="stat-label">Total patients</div><div class="stat-value">${patientCount ?? 0}</div></div>
    </div>

    <div class="section">
      <div class="section-head"><h3>Today's schedule</h3><a href="#appointments" class="btn btn-ghost btn-sm">Open calendar</a></div>
      <div class="glass table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Patient</th><th>Procedure</th><th>With</th><th>Status</th></tr></thead>
          <tbody>
            ${(apptsToday && apptsToday.length) ? apptsToday.map(a => `
              <tr>
                <td class="mono">${fmtTime(a.start_time)}</td>
                <td>${a.patients?.full_name ?? "—"}</td>
                <td>${a.procedures?.name ?? "—"}</td>
                <td>${a.staff?.full_name ?? "—"}</td>
                <td>${statusBadge(a.status)}</td>
              </tr>`).join("") : `<tr><td colspan="5" class="empty">No appointments scheduled for today yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ==========================================================
// PATIENTS
// ==========================================================
async function renderPatients(search = "") {
  let query = supabase.from("patients").select("*").order("full_name");
  if (search) query = query.or(`full_name.ilike.%${search}%,phone.ilike.%${search}%`);
  const { data: patients, error } = await query;

  app.innerHTML = `
    ${pageHead("Patients", "Records, contact details, and clinical notes", `<button class="btn btn-primary" id="add-patient">+ New patient</button>`)}
    <div class="glass card section">
      <div class="searchbar" style="margin-bottom:14px;">
        <input id="psearch" placeholder="Search by name or phone…" value="${search}">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Patient</th><th>Phone</th><th>Email</th><th>DOB</th><th></th></tr></thead>
          <tbody>
            ${(patients && patients.length) ? patients.map(p => `
              <tr>
                <td><div class="row-flex"><div class="avatar">${initials(p.full_name)}</div><div><div style="font-weight:600;">${p.full_name}</div>${p.allergies ? `<div class="hint" style="color:var(--coral-deep);">⚠ ${p.allergies}</div>` : ""}</div></div></td>
                <td class="mono">${p.phone}</td>
                <td>${p.email || "—"}</td>
                <td>${p.dob || "—"}</td>
                <td class="row-flex">
                  <button class="btn btn-ghost btn-sm" data-edit="${p.id}">Edit</button>
                  <button class="btn btn-danger btn-sm" data-del="${p.id}">Delete</button>
                </td>
              </tr>`).join("") : `<tr><td colspan="5" class="empty">No patients yet — add your first patient to get started.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("psearch").addEventListener("input", debounce((e) => renderPatients(e.target.value), 350));
  document.getElementById("add-patient").onclick = () => openPatientForm();
  (patients || []).forEach(p => {
    document.querySelector(`[data-edit="${p.id}"]`)?.addEventListener("click", () => openPatientForm(p));
    document.querySelector(`[data-del="${p.id}"]`)?.addEventListener("click", () => {
      confirmModal(`Delete ${p.full_name}? This also removes their appointments, tokens, and invoices.`, async () => {
        await supabase.from("patients").delete().eq("id", p.id);
        closeModal(); toast("Patient deleted"); renderPatients();
      });
    });
  });

function openAppointmentForm({ patients, staffList, procs, date }) {
  formModal({
    title: "New appointment",
    submitLabel: "Schedule",
    initial: { appointment_date: date },
    fields: [
      { name: "patient_id", label: "Patient", type: "select", required: true, placeholder: "Select patient…", options: (patients || []).map(p => ({ value: p.id, label: p.full_name })) },
      { name: "staff_id", label: "Dentist / staff", type: "select", placeholder: "Select staff…", options: (staffList || []).map(s => ({ value: s.id, label: s.full_name })) },
      { name: "procedure_id", label: "Procedure", type: "select", placeholder: "Select procedure…", options: (procs || []).map(p => ({ value: p.id, label: `${p.name} (${p.duration_minutes}m)` })) },
      { name: "appointment_date", label: "Date", type: "date", required: true },
      { name: "start_time", label: "Start time", type: "time", required: true },
      { name: "notes", label: "Notes", type: "textarea" },
    ],
    onSubmit: async (values) => {
      const proc = (procs || []).find(p => p.id === values.procedure_id);
      let end_time = null;
      if (values.start_time && proc) {
        const [h, m] = values.start_time.split(":").map(Number);
        const total = h * 60 + m + proc.duration_minutes;
        end_time = `${String(Math.floor(total / 60) % 24).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
      }
      const { error } = await supabase.from("appointments").insert({ ...values, end_time, status: "scheduled" });
      if (error) return toast(error.message, "err");
      closeModal(); toast("Appointment scheduled"); renderAppointments(values.appointment_date);
    },
  });
}

async function sendAppointmentConfirmation(a) {
  const phone = a.patients?.whatsapp_phone || a.patients?.phone;
  const { text, link } = buildConfirmationMessage({
    patientName: a.patients?.full_name,
    phone,
    date: fmtDate(a.appointment_date),
    time: fmtTime(a.start_time),
    staffName: a.staff?.full_name,
    template: WA_SETTINGS.confirmation_template,
    defaultCountryCode: WA_SETTINGS.default_country_code,
  });

  if (WA_SETTINGS.send_mode === "api") {
    const res = await sendViaWhatsAppApi({ phone, text, defaultCountryCode: WA_SETTINGS.default_country_code });
    if (res.ok) { toast("Confirmation sent via WhatsApp API"); await supabase.from("appointments").update({ whatsapp_confirmation_sent: true }).eq("id", a.id); }
    else toast("Could not send automatically — opening WhatsApp link instead", "warn");
    if (!res.ok) window.open(link, "_blank");
  } else {
    window.open(link, "_blank");
    await supabase.from("appointments").update({ whatsapp_confirmation_sent: true }).eq("id", a.id);
    toast("Opening WhatsApp — hit send to confirm the appointment");
  }
}

async function renderTokens() {
  const date = todayStr();
  const [{ data: queue }, { data: patients }] = await Promise.all([
    supabase.from("tokens").select("*, patients(full_name, phone)").eq("queue_date", date).order("token_number"),
    supabase.from("patients").select("id, full_name").order("full_name"),
  ]);

  const nowServing = (queue || []).find(t => t.status === "called" || t.status === "in_progress");

  app.innerHTML = `
    ${pageHead("Queue & Tokens", `Walk-in queue for ${fmtDate(date)}`, `<button class="btn btn-primary" id="add-token">+ Issue token</button>`)}

    <div class="glass card section" style="text-align:center; padding:30px;">
      <div class="stat-label">Now serving</div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:56px; font-weight:600; color:var(--teal-deep); margin:6px 0;">${nowServing ? String(nowServing.token_number).padStart(2, "0") : "—"}</div>
      <div style="font-weight:600;">${nowServing ? nowServing.patients.full_name : "No patient called yet"}</div>
      <div class="row-flex" style="justify-content:center; margin-top:16px;">
        <button class="btn btn-primary" id="call-next">Call next token</button>
      </div>
    </div>

    <div class="glass table-wrap section">
      <table>
        <thead><tr><th>Token</th><th>Patient</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${(queue && queue.length) ? queue.map(t => `
            <tr>
              <td class="mono" style="font-weight:700;">${String(t.token_number).padStart(2, "0")}</td>
              <td>${t.patients?.full_name ?? "—"}</td>
              <td>${statusBadge(t.status)}</td>
              <td class="row-flex">
                ${t.status === "waiting" ? `<button class="btn btn-ghost btn-sm" data-call="${t.id}">Call</button>` : ""}
                ${t.status === "called" ? `<button class="btn btn-ghost btn-sm" data-progress="${t.id}">Start</button>` : ""}
                ${t.status === "in_progress" ? `<button class="btn btn-ghost btn-sm" data-done="${t.id}">Mark done</button>` : ""}
                ${(t.status === "waiting" || t.status === "called") ? `<button class="btn btn-danger btn-sm" data-skip="${t.id}">Skip</button>` : ""}
              </td>
            </tr>`).join("") : `<tr><td colspan="4" class="empty">No tokens issued yet today.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("add-token").onclick = () => {
    formModal({
      title: "Issue walk-in token",
      submitLabel: "Issue token",
      fields: [{ name: "patient_id", label: "Patient", type: "select", required: true, placeholder: "Select patient…", options: (patients || []).map(p => ({ value: p.id, label: p.full_name })) }],
      onSubmit: async (values) => {
        const nextNum = (queue && queue.length) ? Math.max(...queue.map(t => t.token_number)) + 1 : 1;
        await supabase.from("tokens").insert({ patient_id: values.patient_id, token_number: nextNum, queue_date: date, status: "waiting" });
        closeModal(); toast(`Token #${nextNum} issued`); renderTokens();
      },
    });
  };

  document.getElementById("call-next").onclick = async () => {
    const next = (queue || []).find(t => t.status === "waiting");
    if (!next) return toast("No one waiting", "warn");
    await supabase.from("tokens").update({ status: "called", called_at: new Date().toISOString() }).eq("id", next.id);
    toast(`Calling token #${next.token_number}`); renderTokens();
  };

  (queue || []).forEach(t => {
    document.querySelector(`[data-call="${t.id}"]`)?.addEventListener("click", async () => { await supabase.from("tokens").update({ status: "called", called_at: new Date().toISOString() }).eq("id", t.id); renderTokens(); });
    document.querySelector(`[data-progress="${t.id}"]`)?.addEventListener("click", async () => { await supabase.from("tokens").update({ status: "in_progress" }).eq("id", t.id); renderTokens(); });
    document.querySelector(`[data-done="${t.id}"]`)?.addEventListener("click", async () => { await supabase.from("tokens").update({ status: "done" }).eq("id", t.id); renderTokens(); });
    document.querySelector(`[data-skip="${t.id}"]`)?.addEventListener("click", async () => { await supabase.from("tokens").update({ status: "skipped" }).eq("id", t.id); renderTokens(); });
  });
}

async function renderBilling() {
  const { data: invoices } = await supabase.from("invoices").select("*, patients(full_name), invoice_items(quantity, unit_price), payments(amount)").order("issue_date", { ascending: false });

  const rows = (invoices || []).map(inv => {
    const sub = (inv.invoice_items || []).reduce((s, it) => s + it.quantity * it.unit_price, 0);
    const afterDiscount = sub - Number(inv.discount || 0);
    const total = afterDiscount + afterDiscount * (Number(inv.tax_percent || 0) / 100);
    const paid = (inv.payments || []).reduce((s, p) => s + Number(p.amount), 0);
    return { ...inv, total, paid, balance: total - paid };
  });

  app.innerHTML = `
    ${pageHead("Billing", "Invoices, payments, and outstanding balances", `<button class="btn btn-primary" id="add-invoice">+ New invoice</button>`)}
    <div class="glass table-wrap">
      <table>
        <thead><tr><th>Invoice</th><th>Patient</th><th>Date</th><th>Total</th><th>Balance</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(inv => `
            <tr>
              <td class="mono">${inv.invoice_number}</td>
              <td>${inv.patients?.full_name ?? "—"}</td>
              <td>${inv.issue_date}</td>
              <td class="mono">${money(inv.total)}</td>
              <td class="mono">${money(inv.balance)}</td>
              <td>${statusBadge(inv.status)}</td>
              <td class="row-flex">
                <button class="btn btn-ghost btn-sm" data-view="${inv.id}">View</button>
              </td>
            </tr>`).join("") : `<tr><td colspan="7" class="empty">No invoices yet — create your first invoice.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("add-invoice").onclick = () => openInvoiceForm();
  rows.forEach(inv => {
    document.querySelector(`[data-view="${inv.id}"]`)?.addEventListener("click", () => openInvoiceDetail(inv.id));
  });
}

async function openInvoiceForm() {
  const [{ data: patients }, { data: procs }] = await Promise.all([
    supabase.from("patients").select("id, full_name").order("full_name"),
    supabase.from("procedures").select("id, name, default_price").eq("active", true).order("name"),
  ]);

  let itemRows = [{ description: "", quantity: 1, unit_price: 0, procedure_id: "" }];

  function itemsHtml() {
    return itemRows.map((it, i) => `
      <div class="row-flex" style="margin-bottom:8px; align-items:flex-end;">
        <div style="flex:2;"><label style="font-size:11px;">Item</label>
          <select data-item-proc="${i}">
            <option value="">Custom item…</option>
            ${(procs || []).map(p => `<option value="${p.id}" data-price="${p.default_price}" ${it.procedure_id === p.id ? "selected" : ""}>${p.name}</option>`).join("")}
          </select>
        </div>
        <div style="flex:2;"><label style="font-size:11px;">Description</label><input data-item-desc="${i}" value="${it.description}"></div>
        <div style="width:70px;"><label style="font-size:11px;">Qty</label><input type="number" step="1" min="1" data-item-qty="${i}" value="${it.quantity}"></div>
        <div style="width:100px;"><label style="font-size:11px;">Price</label><input type="number" step="0.01" data-item-price="${i}" value="${it.unit_price}"></div>
        <button type="button" class="btn btn-danger btn-sm" data-item-del="${i}">×</button>
      </div>`).join("");
  }

  openModalRaw(`
    <div class="modal-head"><h3 style="margin:0;">New invoice</h3><button class="modal-close" id="mclose">&times;</button></div>
    <form id="invform">
      <div class="field"><label>Patient</label>
        <select name="patient_id" required>
          <option value="">Select patient…</option>
          ${(patients || []).map(p => `<option value="${p.id}">${p.full_name}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Items</label><div id="items-wrap">${itemsHtml()}</div>
        <button type="button" class="btn btn-ghost btn-sm" id="add-item">+ Add item</button>
      </div>
      <div class="field-row">
        <div class="field"><label>Discount ($)</label><input type="number" step="0.01" name="discount" value="0"></div>
        <div class="field"><label>Tax (%)</label><input type="number" step="0.01" name="tax_percent" value="0"></div>
      </div>
      <div class="field"><label>Notes</label><textarea name="notes"></textarea></div>
      <div class="row-flex" style="justify-content:flex-end; gap:10px; margin-top:10px;">
        <button type="button" class="btn btn-ghost" id="mcancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Create invoice</button>
      </div>
    </form>
  `, () => {
    const wrap = document.getElementById("items-wrap");
    function bindRows() {
      itemRows.forEach((_, i) => {
        wrap.querySelector(`[data-item-desc="${i}"]`)?.addEventListener("input", (e) => itemRows[i].description = e.target.value);
        wrap.querySelector(`[data-item-qty="${i}"]`)?.addEventListener("input", (e) => itemRows[i].quantity = Number(e.target.value));
        wrap.querySelector(`[data-item-price="${i}"]`)?.addEventListener("input", (e) => itemRows[i].unit_price = Number(e.target.value));
        wrap.querySelector(`[data-item-proc="${i}"]`)?.addEventListener("change", (e) => {
          const opt = e.target.selectedOptions[0];
          itemRows[i].procedure_id = e.target.value || null;
          if (e.target.value) {
            itemRows[i].description = opt.textContent;
            itemRows[i].unit_price = Number(opt.dataset.price || 0);
            wrap.innerHTML = itemsHtml(); bindRows();
          }
        });
        wrap.querySelector(`[data-item-del="${i}"]`)?.addEventListener("click", () => {
          itemRows.splice(i, 1); if (!itemRows.length) itemRows.push({ description: "", quantity: 1, unit_price: 0, procedure_id: "" });
          wrap.innerHTML = itemsHtml(); bindRows();
        });
      });
    }
    bindRows();
    document.getElementById("add-item").onclick = () => { itemRows.push({ description: "", quantity: 1, unit_price: 0, procedure_id: "" }); wrap.innerHTML = itemsHtml(); bindRows(); };
    document.getElementById("mclose").onclick = closeModal;
    document.getElementById("mcancel").onclick = closeModal;
    document.getElementById("invform").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const patient_id = fd.get("patient_id");
      if (!patient_id) return toast("Select a patient", "err");
      const invoice_number = "INV-" + Date.now().toString().slice(-8);
      const { data: inv, error } = await supabase.from("invoices").insert({
        invoice_number, patient_id,
        discount: Number(fd.get("discount") || 0),
        tax_percent: Number(fd.get("tax_percent") || 0),
        notes: fd.get("notes") || null,
      }).select().single();
      if (error) return toast(error.message, "err");
      const items = itemRows.filter(it => it.description).map(it => ({ invoice_id: inv.id, procedure_id: it.procedure_id || null, description: it.description, quantity: it.quantity, unit_price: it.unit_price }));
      if (items.length) await supabase.from("invoice_items").insert(items);
      closeModal(); toast("Invoice created"); renderBilling();
    });
  });
}

  const total = afterDiscount + afterDiscount * (Number(inv.tax_percent || 0) / 100);
  const paid = inv.payments.reduce((s, p) => s + Number(p.amount), 0);
  const balance = total - paid;

  openModalRaw(`
    <div class="modal-head"><h3 style="margin:0;">${inv.invoice_number}</h3><button class="modal-close" id="mclose">&times;</button></div>
    <p style="margin-top:-8px;">${inv.patients.full_name} · ${inv.issue_date} · ${statusBadge(inv.status)}</p>
    <table style="width:100%; font-size:13.5px; margin-bottom:12px;">
      <thead><tr><th style="text-align:left;">Item</th><th>Qty</th><th>Price</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>
        ${inv.invoice_items.map(it => `<tr><td>${it.description}</td><td class="mono" style="text-align:center;">${it.quantity}</td><td class="mono" style="text-align:center;">${money(it.unit_price)}</td><td class="mono" style="text-align:right;">${money(it.quantity * it.unit_price)}</td></tr>`).join("")}
      </tbody>
    </table>
    <div style="text-align:right; font-size:13.5px; line-height:1.9;">
      <div>Subtotal: <strong>${money(sub)}</strong></div>
      <div>Discount: <strong>-${money(inv.discount)}</strong></div>
      <div>Tax (${inv.tax_percent}%): <strong>${money(afterDiscount * (inv.tax_percent / 100))}</strong></div>
      <div style="font-size:16px;">Total: <strong>${money(total)}</strong></div>
      <div>Paid: <strong>${money(paid)}</strong></div>
      <div style="color:${balance > 0 ? "var(--red)" : "var(--green)"};">Balance: <strong>${money(balance)}</strong></div>
    </div>
    ${balance > 0 ? `
    <div class="field-row" style="margin-top:14px;">
      <div class="field"><label>Record payment</label><input type="number" step="0.01" id="pay-amount" placeholder="${balance.toFixed(2)}"></div>
      <div class="field"><label>Method</label>
        <select id="pay-method"><option value="cash">Cash</option><option value="card">Card</option><option value="bank_transfer">Bank transfer</option><option value="insurance">Insurance</option><option value="other">Other</option></select>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" id="record-pay">Record payment</button>
    ` : ""}
    <div class="row-flex" style="justify-content:flex-end; gap:10px; margin-top:16px;">
      <button class="btn btn-coral btn-sm" id="wa-invoice">Send WhatsApp reminder</button>
      <button class="btn btn-ghost" id="mcancel">Close</button>
    </div>
  `, () => {
    document.getElementById("mclose").onclick = closeModal;
    document.getElementById("mcancel").onclick = closeModal;
    document.getElementById("record-pay")?.addEventListener("click", async () => {
      const amount = Number(document.getElementById("pay-amount").value || balance);
      const payment_method = document.getElementById("pay-method").value;
      await supabase.from("payments").insert({ invoice_id: inv.id, amount, payment_method });
      const newPaid = paid + amount;
      const newStatus = newPaid >= total ? "paid" : newPaid > 0 ? "partial" : "unpaid";
      await supabase.from("invoices").update({ status: newStatus }).eq("id", inv.id);
      closeModal(); toast("Payment recorded"); renderBilling();
    });
    document.getElementById("wa-invoice")?.addEventListener("click", () => {
      const phone = inv.patients.whatsapp_phone || inv.patients.phone;
      const text = `Hi ${inv.patients.full_name}, this is Imaan Dental Centre. Your invoice ${inv.invoice_number} has a balance of ${money(balance)}. Let us know if you'd like to arrange payment.`;
      window.open(`https://wa.me/${normalizePhone(phone, WA_SETTINGS.default_country_code)}?text=${encodeURIComponent(text)}`, "_blank");
    });
  });
}

// ==========================================================
// EXPENSES
// ==========================================================
async function renderExpenses() {
  const { data: expenses } = await supabase.from("expenses").select("*").order("expense_date", { ascending: false });
  const monthTotal = (expenses || []).filter(e => e.expense_date?.slice(0, 7) === todayStr().slice(0, 7)).reduce((s, e) => s + Number(e.amount), 0);

  app.innerHTML = `
    ${pageHead("Expenses", "Track clinic costs and outgoings", `<button class="btn btn-primary" id="add-expense">+ New expense</button>`)}
    <div class="glass stat-card section" style="max-width:260px;"><div class="stat-label">This month</div><div class="stat-value">${money(monthTotal)}</div></div>
    <div class="glass table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid to</th><th>Amount</th><th></th></tr></thead>
        <tbody>
          ${(expenses && expenses.length) ? expenses.map(ex => `
            <tr>
              <td>${ex.expense_date}</td>
              <td>${badge(ex.category, "teal")}</td>
              <td>${ex.description || "—"}</td>
              <td>${ex.paid_to || "—"}</td>
              <td class="mono">${money(ex.amount)}</td>
              <td class="row-flex">
                <button class="btn btn-ghost btn-sm" data-edit="${ex.id}">Edit</button>
                <button class="btn btn-danger btn-sm" data-del="${ex.id}">Delete</button>
              </td>
            </tr>`).join("") : `<tr><td colspan="6" class="empty">No expenses logged yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("add-expense").onclick = () => openExpenseForm();
  (expenses || []).forEach(ex => {
    document.querySelector(`[data-edit="${ex.id}"]`)?.addEventListener("click", () => openExpenseForm(ex));
    document.querySelector(`[data-del="${ex.id}"]`)?.addEventListener("click", () => {
      confirmModal("Delete this expense entry?", async () => { await supabase.from("expenses").delete().eq("id", ex.id); closeModal(); toast("Expense deleted"); renderExpenses(); });
    });
  });
}

function openExpenseForm(expense = null) {
  formModal({
    title: expense ? "Edit expense" : "New expense",
    submitLabel: expense ? "Save changes" : "Add expense",
    initial: expense || { expense_date: todayStr() },
    fields: [
      { name: "category", label: "Category", type: "select", required: true, placeholder: "Select…", options: ["Supplies", "Lab fees", "Rent", "Utilities", "Salaries", "Equipment", "Marketing", "Other"].map(c => ({ value: c, label: c })) },
      { name: "description", label: "Description", type: "text" },
      { name: "amount", label: "Amount", type: "number", step: "0.01", required: true },
      { name: "expense_date", label: "Date", type: "date", required: true },
      { name: "paid_to", label: "Paid to", type: "text" },
      { name: "payment_method", label: "Payment method", type: "select", placeholder: "Select…", options: [{ value: "cash", label: "Cash" }, { value: "card", label: "Card" }, { value: "bank_transfer", label: "Bank transfer" }, { value: "other", label: "Other" }] },
    ],
    onSubmit: async (values) => {
      if (expense) await supabase.from("expenses").update(values).eq("id", expense.id);
      else await supabase.from("expenses").insert(values);
      closeModal(); toast(expense ? "Expense updated" : "Expense added"); renderExpenses();
    },
  });
}

// ==========================================================
// STAFF
// ==========================================================
async function renderStaff() {
  const { data: staffList } = await supabase.from("staff").select("*").order("full_name");

  app.innerHTML = `
    ${pageHead("Staff", "Dentists, hygienists, and front desk team", `<button class="btn btn-primary" id="add-staff">+ New staff member</button>`)}
    <div class="glass table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${(staffList && staffList.length) ? staffList.map(s => `
            <tr>
              <td><div class="row-flex"><div class="avatar" style="background:${s.color || "#2FA8A0"};">${initials(s.full_name)}</div>${s.full_name}</div></td>
              <td>${badge(s.role, "coral")}</td>
              <td class="mono">${s.phone || "—"}</td>
              <td>${s.email || "—"}</td>
              <td>${s.active ? badge("active", "green") : badge("inactive", "gray")}</td>
              <td class="row-flex">
                <button class="btn btn-ghost btn-sm" data-edit="${s.id}">Edit</button>
                <button class="btn btn-danger btn-sm" data-del="${s.id}">Delete</button>
              </td>
            </tr>`).join("") : `<tr><td colspan="6" class="empty">No staff added yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("add-staff").onclick = () => openStaffForm();
  (staffList || []).forEach(s => {
    document.querySelector(`[data-edit="${s.id}"]`)?.addEventListener("click", () => openStaffForm(s));
    document.querySelector(`[data-del="${s.id}"]`)?.addEventListener("click", () => {
      confirmModal(`Remove ${s.full_name} from staff?`, async () => { await supabase.from("staff").delete().eq("id", s.id); closeModal(); toast("Staff member removed"); renderStaff(); });
    });
  });
}

function openStaffForm(staffMember = null) {
  formModal({
    title: staffMember ? "Edit staff member" : "New staff member",
    submitLabel: staffMember ? "Save changes" : "Add staff",
    initial: staffMember || { active: true },
    fields: [
      { name: "full_name", label: "Full name", type: "text", required: true },
      { name: "role", label: "Role", type: "select", required: true, placeholder: "Select…", options: [{ value: "dentist", label: "Dentist" }, { value: "hygienist", label: "Hygienist" }, { value: "assistant", label: "Assistant" }, { value: "receptionist", label: "Receptionist" }, { value: "admin", label: "Admin" }] },
      { name: "phone", label: "Phone", type: "tel" },
      { name: "email", label: "Email", type: "email" },
      { name: "active", label: "Active", type: "checkbox" },
    ],
    onSubmit: async (values) => {
      if (staffMember) await supabase.from("staff").update(values).eq("id", staffMember.id);
      else await supabase.from("staff").insert(values);
      closeModal(); toast(staffMember ? "Staff updated" : "Staff added"); renderStaff();
    },
  });
}

// ==========================================================
// SETTINGS
// ==========================================================
async function renderSettings() {
  app.innerHTML = `
    ${pageHead("Settings", "WhatsApp confirmations & clinic preferences")}
    <div class="glass card section" style="max-width:640px;">
      <h3>WhatsApp confirmations</h3>
      <p>Messages are sent from the WhatsApp Business account you have open in
         WhatsApp Web/Desktop. Every "Send WhatsApp" button opens a pre-filled
         chat — just review and hit send from your connected number.</p>
      <form id="wa-form">
        <div class="field"><label>Business display name</label><input name="business_display_name" value="${WA_SETTINGS.business_display_name || ""}"></div>
        <div class="field"><label>Default country code</label><input name="default_country_code" value="${WA_SETTINGS.default_country_code || "+1"}" placeholder="+1"></div>
        <div class="field"><label>Confirmation message template</label>
          <textarea name="confirmation_template">${WA_SETTINGS.confirmation_template || ""}</textarea>
          <div class="hint">Available placeholders: {{patient_name}}, {{date}}, {{time}}, {{staff_name}}</div>
        </div>
        <div class="field"><label>Send mode</label>
          <select name="send_mode">
            <option value="link" ${WA_SETTINGS.send_mode === "link" ? "selected" : ""}>Click-to-chat link (no setup needed)</option>
            <option value="api" ${WA_SETTINGS.send_mode === "api" ? "selected" : ""}>Automatic via WhatsApp Cloud API (needs Edge Function — see README)</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">Save settings</button>
      </form>
    </div>
  `;

  document.getElementById("wa-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const values = Object.fromEntries(fd.entries());
    await supabase.from("whatsapp_settings").update(values).eq("id", 1);
    WA_SETTINGS = { ...WA_SETTINGS, ...values };
    toast("Settings saved");
  });
}
</script>
</body>
